spring.application.name=scheduler
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.profiles.active=local

# JPA schema management: Hibernate creates/updates the schema on startup.
# For production with Flyway, switch to validate + migration scripts.
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

# Database connection can be overridden via environment variables (see .env / .env.production).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/scheduler?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# HikariCP 커넥션 풀 튜닝 (기본값 최대 10 -> 동시 요청 병목 방지)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA 성능 설정: 배치 처리 + 쿼리 정렬(개발용)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Tomcat 스레드/커넥션 튜닝
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=10000
server.tomcat.accept-count=100

# JWT secret must be provided via the JWT_SECRET environment variable (see .env / .env.example).
# No literal secret value is committed here; JwtProvider fails fast on startup if it is missing or too short.
jwt.secret=${JWT_SECRET:}

# Security Settings
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.security.cookie.secure=${APP_SECURITY_COOKIE_SECURE:false}
app.security.cookie.same-site=${APP_SECURITY_COOKIE_SAME_SITE:Lax}
app.security.cookie.domain=${APP_SECURITY_COOKIE_DOMAIN:}

# Session Limits
app.security.session.max-active-sessions=5

# ============================================
# prod 프로필 전용 설정
# Flyway가 스키마 형상 관리를 담당하고 Hibernate는 검증만 수행.
# 초기 구동 시 V0__initial_schema.sql로 테이블을 생성하고
# V1__add_refresh_token_hash.sql로 Refresh Token 해시 저장 방식으로 전환한다.
# ============================================
#---
spring.config.activate.on-profile=prod
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

